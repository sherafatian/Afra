services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: afra
      POSTGRES_USER: afra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U afra]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  backend:
    build: ./BackEnd
    env_file: ./BackEnd/.env
    environment:
      DB_HOST: database
      REDIS_HOST: redis
    ports: ['127.0.0.1:8000:8000']
    volumes: [./BackEnd/storage/keys:/app/storage/keys]
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres_data:
  redis_data:
