document.addEventListener('submit',event=>{const form=event.target;event.preventDefault();if(form.id==='edit-form'){try{saveForm(form)}catch(error){console.error(error);$('#form-error').textContent=t('error')}}if(form.id==='global-search-form'){const q=new FormData(form).get('q');navigate('cases');state.search=String(q||'');render()}if(form.id==='login-form'){const account=db.users.find(u=>u.email.toLowerCase()===String(new FormData(form).get('email')).trim().toLowerCase());if(!account)return toast(t('validEmail'),true);state.userId=account.id;state.loggedIn=true;state.projectId=accessible()[0]?.id;navigate('dashboard');toast(t('welcomeBack'))}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='execution-comment'){state.resultDraft.comment=el.value;return}if(el.dataset.filter){clearTimeout(filterTimer);const key=el.dataset.filter,value=el.value,start=el.selectionStart;filterTimer=setTimeout(()=>{state[key]=value;state.casePage=1;render();const next=$(`[data-filter="${key}"]`);if(next){next.focus();if(next.tagName==='INPUT')next.setSelectionRange(start,start)}},180)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='login-user'){const u=db.users.find(u=>u.id===Number(el.value));$('#login-email').value=u.email;return}if(el.id==='project-switch')return switchProject(Number(el.value));if(el.id==='preview-user'){state.userId=Number(el.value);state.runId=null;state.itemId=null;state.section=null;state.selected.clear();state.search='';state.assignee='';state.priority='';state.status='';state.reportRun='';closeOverlay();render();return}if(el.id==='settings-language'){state.lang=el.value;render();return}if(el.id==='report-run'){state.reportRun=el.value;render();return}if(el.dataset.selectCase){const id=Number(el.dataset.selectCase);el.checked?state.selected.add(id):state.selected.delete(id);render();return}if(el.id==='select-visible'){const visible=filteredCases().slice((state.casePage-1)*8,state.casePage*8);visible.forEach(c=>el.checked?state.selected.add(c.id):state.selected.delete(c.id));render();return}if(el.name==='cases')updatePickCount();if(el.id==='run-plan'){const p=pplans().find(p=>p.id===Number(el.value));$('#edit-form input[name=name]').value=p.name+' — '+t('new');$('#run-preview span').textContent=num(p.cases.filter(id=>db.cases.some(c=>c.id===id)).length)+' '+t('testCount')+' · '+t('snapshot')}if(el.dataset.filter&&el.tagName==='SELECT'){clearTimeout(filterTimer);state[el.dataset.filter]=el.value;state.casePage=1;render()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('#overlays').children.length)closeOverlay();else if(state.mobile||state.notifications){state.mobile=false;state.notifications=false;render()}}if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#overlays').children.length){event.preventDefault();$('#global-search')?.focus()}if(event.key==='Tab'&&$('#overlays').children.length){const focusable=$$('#overlays button:not(:disabled),#overlays input:not(:disabled),#overlays select:not(:disabled),#overlays textarea:not(:disabled)');const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()});
render();

</script></body></html>
